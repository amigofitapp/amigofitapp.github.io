<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>AmigoFit · Entreno</title>
  <!-- Shared workout link: https://amigofitapp.github.io/w.html#<workout id>
       The id is in the #fragment, so it never reaches the server. Only a workout id,
       never a user id. Opens the app on that workout, or Google Play without the app.
       Hand-written (not generated by scripts/build-privacy-page.mjs). -->
  <style>
    :root { --ink: #1B1B1F; --muted: #5E5E68; --gold: #9C7A2E; --edge: #EADFC2; --bg: #FBF8F1; --card: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --ink: #F3EBD6; --muted: #B8B0A0; --gold: #E9C25A; --edge: #3A3122; --bg: #191714; --card: #24211C; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; font-size: 36px;
            background: linear-gradient(135deg, #F6E3A1, #C99A2E); color: #3D2A00; font-weight: 900; }
    h1 { margin: 16px 0 6px; font-size: 24px; line-height: 1.25; }
    p { color: var(--muted); margin: 6px 0; }
    .btn { display: block; margin: 14px 0 0; padding: 14px 18px; border-radius: 999px; font-weight: 800; text-decoration: none; }
    .primary { background: linear-gradient(135deg, #F6E3A1, #C99A2E); color: #3D2A00; }
    .secondary { border: 1.5px solid var(--edge); color: var(--gold); background: var(--card); }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">A</div>
    <h1 id="title">Te han invitado a entrenar</h1>
    <p id="body">Abre el entreno en AmigoFit para ver los detalles y apuntarte.</p>
    <a class="btn primary" id="open" href="#">Abrir en AmigoFit</a>
    <a class="btn secondary" id="store" href="https://play.google.com/store/apps/details?id=com.amigofit.app">Descargar AmigoFit</a>
  </main>
  <script>
    (function () {
      var STORE = 'https://play.google.com/store/apps/details?id=com.amigofit.app';
      var en = !/^es\b/i.test(navigator.language || '');
      if (en) {
        document.documentElement.lang = 'en';
        document.getElementById('title').textContent = "You're invited to a workout";
        document.getElementById('body').textContent = 'Open the workout in AmigoFit to see the details and join.';
        document.getElementById('open').textContent = 'Open in AmigoFit';
        document.getElementById('store').textContent = 'Get AmigoFit';
      }
      var id = decodeURIComponent((location.hash || '').slice(1));
      var open = document.getElementById('open');
      if (!/^[A-Za-z0-9-]{1,64}$/.test(id)) { open.style.display = 'none'; return; }
      var android = /Android/i.test(navigator.userAgent);
      // Android: an intent link opens the app, or Google Play when it isn't installed.
      var href = android
        ? 'intent://workout/' + id + '#Intent;scheme=amigofit;package=com.amigofit.app;S.browser_fallback_url=' +
          encodeURIComponent(STORE) + ';end'
        : 'amigofit://workout/' + id;
      open.href = href;
      if (android) location.replace(href);
    })();
  </script>
</body>
</html>
